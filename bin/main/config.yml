# ============================================================
# DisguisePlugin Configuration
# ============================================================

# ------------------------------------------------------------
# Language
# ------------------------------------------------------------
# Select which language file from the "lang" folder to use.
# Default files: zh_cn (Simplified Chinese) and en_us (English).
#
# To create your own language:
#   1. Copy any existing language file inside the lang folder
#   2. Rename it to your language code (e.g. fr_fr.yml)
#   3. Set that name here (e.g. language: fr_fr)
#   4. Translate the values inside the file
#
# If the selected language file is missing, the plugin falls
# back to Simplified Chinese. Unknown keys also fall back to
# Chinese, and finally to the raw key name.
# ------------------------------------------------------------
language: zh_cn

# ------------------------------------------------------------
# Locator bar
# ------------------------------------------------------------
# Whether to disable the locatorBar (the XP bar that shows the
# direction of nearby players, a feature added in MC 1.21.6).
#
#   true  = disabled (XP bar is shown as normal)
#   false = enabled (XP bar shows the position of other players)
# ------------------------------------------------------------
disable-locator-bar: true

# ------------------------------------------------------------
# /dp command mode
# ------------------------------------------------------------
# Controls who can use the /dp command and the disguise menu.
#
#   admin = admins only
#           Requires the "disguise.admin" permission (OP by default).
#   all   = every player
#           Requires the "disguise.use" permission (true by default).
#   paid  = every player, but disguises cost money
#           Requires the Vault economy plugin (softdepend).
#           Prices and durations are configured in the "mobs" section below.
#           If Vault is not installed, the plugin logs a warning and
#           falls back to "all" mode automatically.
#
# Any invalid value is treated as "all".
# ------------------------------------------------------------
dp-mode: paid

# ------------------------------------------------------------
# Mob prices and disguise durations (used in paid mode)
# ------------------------------------------------------------
# One entry per mob, combining the disguise price and duration:
#
#   <mob-name>: { price: <cost>, duration: <seconds> }
#
#   price    - the amount of coins charged when a player disguises
#              as this mob (currency provided by the Vault economy)
#   duration - how long the disguise lasts in seconds before it is
#              automatically removed. Set 0 for unlimited time.
#
# Example:
#   sheep: { price: 100, duration: 1800 }
#   → disguising as a Sheep costs 100 coins and lasts
#     1800 seconds (30 minutes), then is removed automatically.
#   sheep: { price: 50, duration: 0 }
#   → costs 50 coins, lasts forever until the player undoes it.
#
# Mob names are the plugin's internal ids (lowercase enum names,
# e.g. ender_dragon, skeleton_horse, zombie_villager, happy_ghast).
# All 86 mobs are listed below with default values - adjust freely.
# A price of 0 means disguising as that mob is free.
# ------------------------------------------------------------
