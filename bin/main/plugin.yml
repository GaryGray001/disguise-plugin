name: DisguisePlugin
version: '${version}'
main: com.disguise.DisguisePlugin
api-version: '1.21'
author: History-cat
description: A disguise plugin letting players transform into 80+ mobs with a GUI menu, baby/size options, colors and mob-specific mechanics.

commands:
  dp:
    description: Open the disguise menu
    usage: /dp [reload]
    permission: disguise.use

permissions:
  disguise.use:
    description: Allows using the disguise feature
    default: true
  disguise.reload:
    description: Allows reloading the plugin config
    default: op
