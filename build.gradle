import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
}

// 依赖（paper-api 1.21.9）本身是 Java 21 构建的，按 21 解析；
// 但编译产物用 options.release=17 输出 Java 17 字节码，兼容 1.17+ 服务器
configurations.all {
    attributes.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
}

group = 'com.disguise'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // 用 Paper API 编译（1.21.9），但代码只调用 Bukkit/Spigot 标准 API（无 Paper 专属方法），
    // 因此产物兼容 Paper / Spigot / Purpur 及所有 Paper fork。
    // 服务端版本：api-version 1.21 → 1.21.x 全部支持（1.21.0-1.21.3 已通过反射/safeMaterial
    // 处理新生物与材质，低版本自动隐藏不支持的内容，实测版本 1.21.9）
    compileOnly 'io.papermc.paper:paper-api:1.21.9-R0.1-SNAPSHOT'
    // Vault 经济 API（软依赖：付费模式需要服务器安装 Vault 插件）
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Java 17 字节码：兼容 1.17+ 服务器（1.17/1.18 用 Java 17，1.19+ 用 Java 17+）
    options.release.set(17)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
